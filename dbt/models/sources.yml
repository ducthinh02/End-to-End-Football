version: 2

sources:
  - name:  raw
    description: "Raw data from football-data.org"
    database: db
    schema: raw

    tables:
      - name: areas
        description: "Bảng dữ liệu về khu vực"
        columns:
          - name: area_id
            data_tests:
              - unique
              - not_null

      - name: competition
        description: "Bảng dữ liệu về khu vực"
        columns:
          - name: competition_id
            data_tests:
              - unique
              - not_null

      - name: matches
        description: "Bảng dữ liệu về khu vực"
        columns:
          - name: match_id
            data_tests:
              - unique
              - not_null
          - name: season_id
            data_tests:
              - not_null
          - name: competition_id
            data_tests: 
              - not_null

      - name: player
        description: "Bảng dữ liệu về khu vực"
        columns:
          - name: player_id
            data_tests:
              - unique
              - not_null

      - name: season
        description: "Bảng dữ liệu về khu vực"
        columns:
          - name: season_id
            data_tests:
              - unique
              - not_null

      - name: standing
        description: "Bảng dữ liệu về khu vực"
        columns:
          - name: season_id
            data_tests:
              - not_null
          - name: competition_id
            data_tests:
              - not_null
          - name: team_id
            data_tests:
              - not_null

      - name: team_competition
        description: "Bảng dữ liệu về khu vực"
        columns:
          - name: season_id
            data_tests:
              - not_null
          - name: competition_id
            data_tests: 
              - not_null
          - name: team_id
            data_tests:
              - not_null

      - name: teams
        description: "Bảng dữ liệu về khu vực"
        columns:
          - name: team_id
            data_tests:
              - unique
              - not_null

      - name: top_scorers
        description: "Bảng dữ liệu về khu vực" 
        columns:
          - name: season_id
            data_tests:
              - not_null
          - name: competition_id
            data_tests: 
              - not_null
          - name: team_id
            data_tests:
              - not_null
          - name: player_id
            data_tests:
              - not_null