version: 2

models:
      - name: stg_areas
        description: "Bảng staging về khu vực"
        columns:
          - name: area_id
            data_tests:
              - unique
              - not_null
      
      - name: stg_competition
        description: "Bảng staging về giải đấu"
        columns:
          - name: competition_id
            data_tests:
              - unique
              - not_null
      
      - name: stg_matches
        description: "Bảng dữ liệu về khu vực"
        columns:
